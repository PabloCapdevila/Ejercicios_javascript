<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <script src="Ejercicio_1.js"></script>
</head>
<body>
    <h1>FORMULARIO</h1>
 
    <form id="formulario" method="get">

        <label for="nombre">Nombre:</label><input type="text" id="nombre" name="nombre"><br>
 
        <label for="apellidos">Apellidos:</label><input type="text" id="apellidos" name="apellidos"><br>
 
        <label for="telefono">Telefono:</label><input type="text" id="telefono" name="telefono"><br>
 
        <label for="dni">Dni:</label><input type="text" id="dni" name="dni"><br>
 
        <label for="edad">Edad:</label><input type="text" id="edad" name="edad"><br>
 
        Sexo:<br>
        <input type="radio" id="hombre" name="sexo" value="hombre"><label for="hombre">Hombre</label><br>
        <input type="radio" id="mujer" name="sexo" value="mujer"><label for="mujer">Mujer</label><br>
 

        <label for="foto">Incluir mi foto: </label><input type="file" id="foto" name="foto"><br>
 
        <input type="checkbox" id="publicidad" name="publicidad"><label for="publicidad">Enviar publicidad</label><br>
 
        <label for="aficiones">Elige tu afición favorita:</label>
        <select id="aficiones" name="aficiones">
            <option value="musica">musica</option>
            <option value="lectura">lectura</option>
            <option value="deporte">deporte</option>
        </select><br><br>
 
        <label for="observaciones">Observaciones:</label><br>
        <textarea id="observaciones" name="observaciones"></textarea><br>
 
        <input type="submit" value="Guardar cambios">
        <input type="reset" value="Borrar los datos introducidos">
    </form>
</body>
</html>
